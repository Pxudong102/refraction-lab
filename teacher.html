<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师管理端 · 光的折射</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="shell">
  <div class="topbar"><div class="brand"><h1>教师管理端 · 实验数据汇总</h1><p>登录后查看、筛选并下载学生提交的数据</p></div><div class="toplinks"><a class="btn" href="index.html">学生端</a><button class="btn" id="logoutBtn" style="display:none">退出登录</button></div></div>

  <section class="card login" id="loginCard">
    <h2 class="section-title">教师登录</h2>
    <label for="email">教师邮箱</label><input class="input" id="email" type="email" autocomplete="username">
    <label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password">
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="loginBtn">登录</button></div>
    <div class="status" id="loginStatus"></div>
  </section>

  <main id="dashboard" style="display:none">
    <div class="summary">
      <div class="metric"><span>提交记录</span><b id="submissionCount">0</b></div>
      <div class="metric"><span>实验组数</span><b id="groupCount">0</b></div>
      <div class="metric"><span>数据点数</span><b id="pointCount">0</b></div>
      <div class="metric"><span>班级数量</span><b id="classCount">0</b></div>
    </div>
    <section class="card main">
      <div class="filters">
        <input class="input" id="filterClass" placeholder="筛选班级">
        <input class="input" id="filterGroup" placeholder="筛选组别">
        <input class="input" id="filterMedium" placeholder="筛选介质（可选）">
        <button class="btn" id="refreshBtn">刷新</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <button class="btn good" id="analysisCsvBtn">下载分析平台 CSV</button>
        <button class="btn" id="detailCsvBtn">下载详细 CSV</button>
      </div>
      <div class="hint download-hint">建议先筛选班级再下载：CSV 文件名会自动带上班级名称，分析平台中的“数据组”仅使用组别名。</div>
      <div class="table-wrap"><table class="teacher-table"><thead><tr><th>时间</th><th>班级</th><th>组别</th><th>学生</th><th>介质</th><th>i, r 数据</th><th>备注</th><th></th></tr></thead><tbody id="teacherBody"></tbody></table></div>
      <div class="status" id="dashStatus"></div>
    </section>
  </main>
  <div class="footer">教师端只对 Supabase 教师白名单账号开放</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="teacher.js"></script>
</body></html>
